# ============================================================
# SMOKE CHECK AUTOMÁTICO — roda após cada push e todo dia às 8h (BRT)
# Requisito único: criar o secret DATABASE_URL no GitHub
# (repo → Settings → Secrets and variables → Actions → New repository secret)
# Recomendação futura: criar um usuário Postgres SOMENTE-LEITURA no Supabase
# para este secret (princípio do menor privilégio).
# ============================================================
name: Daily Health Check

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 11 * * *" # 11:00 UTC = 08:00 BRT, diário
  workflow_dispatch: {} # botão "Run workflow" manual no GitHub

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      # Espera 60s no push (dá tempo da Vercel publicar o deploy do mesmo commit)
      - name: Aguardar deploy da Vercel
        if: github.event_name == 'push'
        run: sleep 60

      - name: Smoke check — tenant maison
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: >
          node scripts/smoke-check.mjs
          --base https://maisonstate.vercel.app
          --host maison.maisonstate.vercel.app
          --tenant maison
          --json healthcheck-maison.json

      - name: Smoke check — demo maison-prime
        if: always() # roda mesmo se o primeiro falhar (relatório completo)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: >
          node scripts/smoke-check.mjs
          --base https://maisonstate.vercel.app
          --host maison-prime.maisonstate.vercel.app
          --tenant maison-prime
          --json healthcheck-maison-prime.json

      - name: Publicar histórico (JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthcheck-${{ github.run_number }}
          path: healthcheck-*.json
          retention-days: 90
